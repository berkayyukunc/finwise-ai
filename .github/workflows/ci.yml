name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      # Model repoda izlenir; yine de CI'da sıfırdan eğitilir: eğitim hattı bozulursa ya da
      # altın set metriği tabanın altına düşerse (tests/test_nlp.py) birleştirme engellenir.
      - name: Train (leak-free protocol)
        run: PYTHONPATH=. python train_nlp_model.py
      - name: Tests + coverage gate
        run: python -m pytest --cov --cov-report=term-missing
      - name: Upload model metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: data/models/pos_model_metrics.json
